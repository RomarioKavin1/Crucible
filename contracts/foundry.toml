[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# RunRegistryV3.publish() has 10 params + Run has 12 fields → exceeds the
# stack limit without via-IR codegen.
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]
# 0G Galileo + Mainnet require min 2 gwei. Use legacy txns to avoid EIP-1559
# priority-fee-vs-max-fee mismatches with Foundry's auto-estimate.
gas_price = 2_000_000_000
legacy = true

[rpc_endpoints]
galileo = "${OG_GALILEO_RPC}"
mainnet = "${OG_MAINNET_RPC}"
