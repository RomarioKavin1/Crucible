[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]
# 0G Galileo + Mainnet require min 2 gwei priority fee — Foundry's default of 1 wei is rejected
priority_gas_price = 2_000_000_000

[rpc_endpoints]
galileo = "${OG_GALILEO_RPC}"
mainnet = "${OG_MAINNET_RPC}"
